services:
  db:
    image: postgres:16
    container_name: beef-postgres
    restart: unless-stopped
    ports:
      - "${PG_HOST_PORT}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - beef_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphhopper:
    build:
      context: .
      dockerfile: docker/graphhopper/Dockerfile
      args:
        GH_VERSION: ${GRAPHHOPPER_VERSION:-10.2}
    container_name: beef-graphhopper
    restart: unless-stopped
    ports:
      - "${GRAPHHOPPER_HOST_PORT:-8989}:8989"
    environment:
      JAVA_OPTS: "${GRAPHHOPPER_JAVA_OPTS:--Xms2g -Xmx2g}"
    volumes:
      - ${GRAPHHOPPER_CONFIG_FILE:-./graphhopper/config.yml}:/data/config.yml:ro
      - ${GRAPHHOPPER_MAP_FILE:?Please set GRAPHHOPPER_MAP_FILE to the path of your .osm.pbf map}:/data/map.osm.pbf:ro
      - graphhopper-cache:/data/graph-cache

  graphhopper_ui:
    image: node:20-bullseye
    container_name: beef-graphhopper-ui
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run serve"
    volumes:
      - ./graphhopper_ui:/app
      - graphhopper_ui_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      GRAPHHOPPER_UI_ROUTING_API: "${GRAPHHOPPER_UI_ROUTING_API:-http://host.docker.internal:8989/}"
      GRAPHHOPPER_UI_GEOCODING_API: "${GRAPHHOPPER_UI_GEOCODING_API:-https://graphhopper.com/api/1/}"
      BEEF_STATS_API_BASE: "${BEEF_STATS_API_BASE:-http://127.0.0.1:8000}"
    ports:
      - "${GRAPHHOPPER_UI_HOST_PORT:-3000}:3000"
    depends_on:
      graphhopper:
        condition: service_started

volumes:
  beef_pgdata:
  graphhopper-cache:
  graphhopper_ui_node_modules:
